[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tfg-rul-uncertainty"
version = "0.2.0"
description = "Where RUL prediction intervals fail to cover and what it costs: conditional coverage and decision value on NASA C-MAPSS (bachelor's thesis)."
requires-python = ">=3.10"
# Exact versions used for the reported numbers are pinned in requirements.txt.
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "lightgbm",
    "matplotlib",
    "mapie>=1.4",
]

[project.optional-dependencies]
dev = ["pytest", "ipykernel", "nbformat", "nbconvert", "nbclient"]

# The package is literally called `src` (python -m src.load, import src.features ...).
[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
